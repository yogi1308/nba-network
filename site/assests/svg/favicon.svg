<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <g id="graph-network">
    <!-- White Outlines for Connecting Lines (Thicker white stroke underneath) -->
    <line x1="250" y1="250" x2="250" y2="80" stroke="#ffffff" stroke-width="26" stroke-linecap="round" />
    <line x1="250" y1="250" x2="400" y2="160" stroke="#ffffff" stroke-width="26" stroke-linecap="round" />
    <line x1="250" y1="250" x2="400" y2="340" stroke="#ffffff" stroke-width="26" stroke-linecap="round" />
    <line x1="250" y1="250" x2="250" y2="420" stroke="#ffffff" stroke-width="26" stroke-linecap="round" />
    <line x1="250" y1="250" x2="100" y2="340" stroke="#ffffff" stroke-width="26" stroke-linecap="round" />
    <line x1="250" y1="250" x2="100" y2="160" stroke="#ffffff" stroke-width="26" stroke-linecap="round" />

    <!-- Main Connecting Lines -->
    <line x1="250" y1="250" x2="250" y2="80" stroke="#1e3a8a" stroke-width="20" stroke-linecap="round" />
    <line x1="250" y1="250" x2="400" y2="160" stroke="#1e3a8a" stroke-width="20" stroke-linecap="round" />
    <line x1="250" y1="250" x2="400" y2="340" stroke="#1e3a8a" stroke-width="20" stroke-linecap="round" />
    <line x1="250" y1="250" x2="250" y2="420" stroke="#1e3a8a" stroke-width="20" stroke-linecap="round" />
    <line x1="250" y1="250" x2="100" y2="340" stroke="#1e3a8a" stroke-width="20" stroke-linecap="round" />
    <line x1="250" y1="250" x2="100" y2="160" stroke="#1e3a8a" stroke-width="20" stroke-linecap="round" />

    <!-- Outer Nodes with White Outlines -->
    <circle cx="250" cy="80" r="36" fill="#b91c1c" stroke="#ffffff" stroke-width="6" />
    <circle cx="400" cy="160" r="36" fill="#b91c1c" stroke="#ffffff" stroke-width="6" />
    <circle cx="400" cy="340" r="36" fill="#b91c1c" stroke="#ffffff" stroke-width="6" />
    <circle cx="250" cy="420" r="36" fill="#b91c1c" stroke="#ffffff" stroke-width="6" />
    <circle cx="100" cy="340" r="36" fill="#b91c1c" stroke="#ffffff" stroke-width="6" />
    <circle cx="100" cy="160" r="36" fill="#b91c1c" stroke="#ffffff" stroke-width="6" />

    <!-- Center Node with White Outline -->
    <circle cx="250" cy="250" r="42" fill="#b91c1c" stroke="#ffffff" stroke-width="6" />
  </g>
</svg>

